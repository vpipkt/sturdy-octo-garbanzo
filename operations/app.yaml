apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: apache
      targetRevision: 9.6.1
      helm:
        releaseName: demo
        valueFiles:
          - $values/operations/kind/science/values.yaml
          - $values/operations/kind/science/demo.yaml
    - repoURL: https://github.com/vpipkt/sturdy-octo-garbanzo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: science
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
